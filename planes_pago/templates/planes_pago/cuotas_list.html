{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cuotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    </head>
<body class="p-4">

<!-- 📌 Navbar -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">ISDM Pagos</a>
        <div>
        <a href="/planes/" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-list"></i> Planes</a>
        <a href="/cuotas/" class="btn btn-outline-light btn-sm"><i class="bi bi-cash-stack"></i> Cuotas</a>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="mb-3"><i class="bi bi-cash"></i> Cuotas</h3>

    <!-- 📌 Botón Nueva Cuota -->
    <button id="btnNuevaCuota" class="btn btn-primary mb-3" 
            data-bs-toggle="modal" data-bs-target="#modalForm">
        <i class="bi bi-plus-circle"></i> Nueva Cuota
    </button>

    <!-- 📌 Tabla -->
    <table id="tablaCuotas" class="table table-striped table-hover align-middle" style="width:100%">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Plan</th>
            <th>Número</th>
            <th>Vencimiento</th>
            <th>Monto</th>
            <th>Acciones</th>
        </tr>
        </thead>
    </table>
</div>

<!-- 📌 Modal -->
<div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog">
        <form id="formCuota" class="modal-content">
        {% csrf_token %}
        <input type="hidden" name="id">
        <div class="modal-header bg-success text-white">
            <h5 class="modal-title"><i class="bi bi-pencil-square"></i> Cuota</h5>
        </div>
        <div class="modal-body">
            <select name="plan" class="form-control mb-2" required>
            <option value="">-- Seleccionar Plan --</option>
            {% for p in plans %}
                <option value="{{ p.id }}">{{ p.nombre }}</option>
            {% endfor %}
            </select>
            <input name="numero" type="number" class="form-control mb-2" placeholder="Número" required>
            <input name="vencimiento" type="date" class="form-control mb-2" required>
            <input name="monto" type="number" step="0.01" class="form-control mb-2" placeholder="Monto" required>
        </div>
        <div class="modal-footer">
            <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Guardar</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
        </form>
    </div>
</div>

<!-- 📌 Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.print.min.js"></script>

<script>
const tablaCuotas = $('#tablaCuotas').DataTable({
    ajax: "{% url 'cuotas_data' %}",
    dom: 'Bfrtip',
    buttons: ['excel', 'pdf', 'print'],
    columns: [
        {data: 'id'},
        {data: 'plan'},
        {data: 'numero'},
        {data: 'vencimiento'},
        {data: 'monto'},
        {
        data: null,
        orderable: false,
        render: row => `
            <button class="btn btn-sm btn-info btn-editar"
            data-id="${row.id}" data-plan="${row.plan}" 
            data-numero="${row.numero}" data-vencimiento="${row.vencimiento}" 
            data-monto="${row.monto}">
            <i class="bi bi-pencil"></i> Editar
            </button>
            <button class="btn btn-sm btn-danger btn-borrar" data-id="${row.id}">
            <i class="bi bi-trash"></i> Eliminar
            </button>`
        }
    ]
});

// Guardar (crear/editar)
$('#formCuota').on('submit', e => {
    e.preventDefault();
    $.post("{% url 'cuota_guardar' %}", $('#formCuota').serialize(), () => {
        $('#modalForm').modal('hide');
        tablaCuotas.ajax.reload();
    });
});

// Nueva Cuota → limpiar
$('#btnNuevaCuota').on('click', function() {
    $('#formCuota')[0].reset();
    $('#formCuota input[name=id]').val('');
});

// Editar
$('#tablaCuotas').on('click', '.btn-editar', function() {
    const b = $(this);
    $('#formCuota input[name=id]').val(b.data('id'));
    $('#formCuota select[name=plan]').val(b.data('plan'));
    $('#formCuota input[name=numero]').val(b.data('numero'));
    $('#formCuota input[name=vencimiento]').val(b.data('vencimiento'));
    $('#formCuota input[name=monto]').val(b.data('monto'));
    $('#modalForm').modal('show');
});

// Eliminar
$('#tablaCuotas').on('click', '.btn-borrar', function() {
    const id = $(this).data('id');
    $.post(`/cuotas/eliminar/${id}/`, {'csrfmiddlewaretoken': '{{ csrf_token }}'}, () => tablaCuotas.ajax.reload());
});
</script>

</body>
</html>
