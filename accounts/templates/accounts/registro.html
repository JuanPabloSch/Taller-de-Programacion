{% extends "base.html" %}
{% load static %}

{% block title %}Registrarse{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center vh-100">
    <div class="col-md-4">
        <div class="card shadow-lg">
            <div class="card-body text-center">
                <!-- Logo -->
                <img src="{% static 'img/logo.png' %}" alt="Logo" class="mb-3" style="max-width: 100px;">

                <h3 class="mb-4">Crear cuenta</h3>

                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}

                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label d-block text-center">{{ field.label }}</label>
                            <div class="d-flex justify-content-center">
                                <div style="width: 80%;">
                                    {{ field }}
                                </div>
                            </div>
                            <div class="text-danger small text-center">{{ field.errors }}</div>
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
                </form>

                <p class="mt-3">
                    ¿Ya tenés cuenta?
                    <a href="{% url 'login' %}">Iniciá sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
