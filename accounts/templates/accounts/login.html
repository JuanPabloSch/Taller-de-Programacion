{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<style>
    /* Estilos responsive para el login */
    .login-container {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
    }

    .login-card {
        width: 100%;
        max-width: 440px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .login-logo {
        width: 80px;
        height: 80px;
        object-fit: contain;
    }

    .login-title {
        font-size: 1.75rem;
        font-weight: 600;
        margin-top: 1rem;
    }

    /* Responsive adjustments */
    @media (max-width: 576px) {
        .login-card {
            max-width: 100%;
            border-radius: 8px;
        }

        .login-logo {
            width: 60px;
            height: 60px;
        }

        .login-title {
            font-size: 1.5rem;
        }

        .login-container {
            min-height: 60vh;
            padding: 0.5rem;
        }
    }

    @media (max-width: 400px) {
        .login-card {
            box-shadow: none;
            border: 1px solid #dee2e6;
        }

        .login-logo {
            width: 50px;
            height: 50px;
        }

        .login-title {
            font-size: 1.25rem;
        }
    }

    /* Landscape mobile */
    @media (max-height: 500px) and (orientation: landscape) {
        .login-container {
            min-height: auto;
            padding: 0.5rem 1rem;
        }

        .login-logo {
            width: 50px;
            height: 50px;
        }

        .login-title {
            font-size: 1.25rem;
            margin-top: 0.5rem;
        }
    }

    /* Enhanced form controls */
    .login-card .form-control {
        padding: 0.625rem 0.875rem;
        font-size: 0.95rem;
        border: 1.5px solid #ced4da;
        border-radius: 8px;
        transition: all 0.2s ease-in-out;
    }

    .login-card .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    .login-card .form-control:hover:not(:focus) {
        border-color: #adb5bd;
    }

    .btn-login {
        padding: 0.625rem 1.5rem;
        font-weight: 600;
        font-size: 1rem;
        border-radius: 8px;
        transition: all 0.2s ease-in-out;
        letter-spacing: 0.3px;
    }

    .btn-login:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
    }

    .btn-login:active {
        transform: translateY(0);
    }

    @media (max-width: 576px) {
        .login-card .form-control {
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
        }

        .btn-login {
            padding: 0.5rem 1.25rem;
            font-size: 0.95rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card login-card">
        <div class="card-body p-4 p-sm-5">

            <div class="text-center mb-4">
                <img src="{% static 'img/logo.png' %}" alt="ISDM Logo" class="login-logo">
                <h2 class="login-title">Iniciar sesión</h2>
            </div>

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label"><i class="bi bi-person"></i>Usuario</label>
                    <input
                        type="text"
                        class="form-control form-control-lg"
                        id="username"
                        name="username"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                        
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label"><i class="bi bi-lock"></i>Contraseña</label>
                    <input
                        type="password"
                        class="form-control form-control-lg"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary btn-login" style="min-width: 200px;">
                        Entrar
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
