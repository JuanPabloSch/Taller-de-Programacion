{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-sm p-4" style="width: 400px; max-width: 90%;">
        
        <div class="text-center mb-4">
        <img src="{% static 'img/logo.png' %}" alt="ISDM Logo" width="80" height="80">
        <h2 class="mt-2">Iniciar sesión</h2>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <div class="text-center mt-3">
        <p class="mb-0">¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate</a></p>
        </div>
    </div>
</div>
{% endblock %}
